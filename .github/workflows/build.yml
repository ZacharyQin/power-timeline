name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:frontend
      - run: pnpm build
      - run: python3 -m unittest discover -s tests -v
      - name: Package plugin ZIP
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          root = Path(".")
          version = json.loads((root / "package.json").read_text())["version"]
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/") and ref != f"refs/tags/v{version}":
              raise SystemExit(f"{ref} does not match package.json version v{version}")
          package = root / "dist" / f"power-timeline-{version}.zip"
          package.parent.mkdir(exist_ok=True)
          members = [root / name for name in (
              "plugin.json", "package.json", "main.py", "LICENSE", "CHANGELOG.md",
              "README.md", "docs/readme/README.zh-CN.md", "docs/readme/README.pt.md", "docs/readme/README.es.md", "docs/readme/README.ja.md", "docs/readme/README.ko.md", "dist/index.js", "dist/front-hardware.png", "dist/front-rotor.png", "dist/front-fan-front.png", "dist/notices.json", "dist/license-sources.zip")]
          members += sorted((root / "py_modules").glob("*.py"))
          members += sorted(path for path in (root / "licenses").rglob("*") if path.is_file())
          with zipfile.ZipFile(package, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in members:
                  archive.write(path, "power-timeline/" + path.relative_to(root).as_posix())
          print(package, package.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: power-timeline
          path: dist/power-timeline-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: power-timeline
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          version = os.environ["GITHUB_REF"].removeprefix("refs/tags/v")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          prefix = f"## {version}"
          start = next((i for i, line in enumerate(lines) if line == prefix or line.startswith(prefix + " ")), None)
          if start is None:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          Path("release-notes.md").write_text("\n".join(lines[start:end]).strip() + "\n", encoding="utf-8")
          PY
          gh release create "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file release-notes.md
