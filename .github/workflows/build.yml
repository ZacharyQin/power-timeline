name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: python3 -m unittest discover -s tests -v
      - name: Package plugin ZIP
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          root = Path(".")
          version = json.loads((root / "package.json").read_text())["version"]
          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/") and ref != f"refs/tags/v{version}":
              raise SystemExit(f"{ref} does not match package.json version v{version}")
          package = root / "dist" / f"power-timeline-{version}.zip"
          package.parent.mkdir(exist_ok=True)
          members = [root / name for name in (
              "plugin.json", "package.json", "main.py", "LICENSE",
              "README.md", "README.zh-CN.md", "README.pt.md", "README.es.md", "README.ja.md", "README.ko.md", "dist/index.js")]
          members += sorted((root / "py_modules").glob("*.py"))
          with zipfile.ZipFile(package, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in members:
                  archive.write(path, "power-timeline/" + path.relative_to(root).as_posix())
          print(package, package.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: power-timeline
          path: dist/power-timeline-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: power-timeline
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "Power Timeline ${tag#v}"
